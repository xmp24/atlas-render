name: fetchflags
on:
  workflow_dispatch:
    inputs:
      q: {required: true}
permissions:
  contents: write
jobs:
  get:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir o && cd o
          python3 - <<'P'
          import json, urllib.request, urllib.parse, os, re
          qs = json.loads('''${{ inputs.q }}''')
          H = {'User-Agent': 'atlas-flags/1.0 (educational)'}
          log = {}
          for key, terms in qs.items():
              got = []
              for term in terms:
                  u = 'https://commons.wikimedia.org/w/api.php?' + urllib.parse.urlencode({'action':'query','list':'search','srnamespace':6,'srsearch':term,'srlimit':4,'format':'json'})
                  try:
                      r = json.load(urllib.request.urlopen(urllib.request.Request(u, headers=H), timeout=30))
                      for hit in r['query']['search']:
                          t = hit['title']
                          if not re.search(r'\.(svg|png)$', t, re.I): continue
                          got.append(t)
                  except Exception as e: print('ERR', key, e)
                  if got: break
              log[key] = got[:3]
              for i, t in enumerate(got[:3]):
                  fn = t[5:]
                  url = 'https://commons.wikimedia.org/wiki/Special:FilePath/' + urllib.parse.quote(fn)
                  ext = fn.rsplit('.', 1)[1].lower()
                  try:
                      d = urllib.request.urlopen(urllib.request.Request(url, headers=H), timeout=60).read()
                      open(f'{key}_{i}.{ext}', 'wb').write(d)
                  except Exception as e: print('DL ERR', key, fn, e)
          json.dump(log, open('log.json', 'w'), indent=1, ensure_ascii=False)
          P
          git init -q -b f && git add -A && git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -qm f
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" f:refs/heads/flags-hist
